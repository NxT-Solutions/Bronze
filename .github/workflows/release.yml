name: 🔖 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.set_tag.outputs.release_tag }}
      version: ${{ steps.set_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set version
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          version="${input#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          VERSION="${version}" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          cargo = Path("apps/desktop/src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
          cargo.write_text(text, encoding="utf-8")

          conf = Path("apps/desktop/src-tauri/tauri.conf.json")
          conf_text = conf.read_text(encoding="utf-8")
          conf_text, n = re.subn(
              r'"version": "[^"]+"',
              f'"version": "{version}"',
              conf_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("tauri.conf.json version was not updated")
          conf.write_text(conf_text, encoding="utf-8")

          desktop_pkg = Path("apps/desktop/package.json")
          pkg_text = desktop_pkg.read_text(encoding="utf-8")
          pkg_text, n = re.subn(
              r'"version": "[^"]+"',
              f'"version": "{version}"',
              pkg_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("apps/desktop/package.json version was not updated")
          desktop_pkg.write_text(pkg_text, encoding="utf-8")

          lock = Path("Cargo.lock")
          lines = lock.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          in_pkg = False
          for line in lines:
              if line.startswith("[[package]]"):
                  in_pkg = False
              if line.strip() == 'name = "bronze-desktop"':
                  in_pkg = True
              if in_pkg and line.strip().startswith("version = "):
                  line = f'version = "{version}"\n'
                  in_pkg = False
              out.append(line)
          lock.write_text("".join(out), encoding="utf-8")
          PY

      - name: Update changelog
        shell: bash
        env:
          VERSION: ${{ steps.set_tag.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}" python3 - <<'PY'
          import datetime
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          today = datetime.date.today().isoformat()
          changelog = Path("CHANGELOG.md")
          if not changelog.exists():
              changelog.write_text(
                  "\n".join(
                      [
                          "# Changelog",
                          "",
                          "All notable changes to this project will be documented in this file.",
                          "This file is auto-updated by the release workflow.",
                          "",
                          "## Unreleased",
                          "",
                          "- Work in progress.",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )

          text = changelog.read_text(encoding="utf-8")
          lines = text.splitlines()
          all_tags = (
              subprocess.check_output(
                  ["git", "tag", "--list", "v*", "--sort=-v:refname"], text=True
              )
              .strip()
              .splitlines()
          )
          current_tag = f"v{version}"
          previous_tag = next((tag for tag in all_tags if tag != current_tag), None)
          range_spec = "HEAD" if previous_tag is None else f"{previous_tag}..HEAD"
          commits = (
              subprocess.check_output(
                  ["git", "log", "--no-merges", "--pretty=format:%s", range_spec],
                  text=True,
              )
              .strip()
              .splitlines()
          )
          messages = []
          for subject in commits:
              subject = subject.strip()
              if not subject:
                  continue
              if "bump version to v" in subject.lower():
                  continue
              messages.append(subject)
          if not messages:
              messages = ["Internal maintenance updates."]
          notes = [f"- {subject}" for subject in messages]

          version_header_pattern = re.compile(
              rf"^## v{re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$"
          )
          cleaned = []
          index = 0
          while index < len(lines):
              if version_header_pattern.match(lines[index].strip()):
                  index += 1
                  while index < len(lines) and not lines[index].startswith("## "):
                      index += 1
                  continue
              cleaned.append(lines[index])
              index += 1
          lines = cleaned

          if not any(line.strip() == "## Unreleased" for line in lines):
              if lines and lines[-1].strip():
                  lines.append("")
              lines.extend(["## Unreleased", "", "- Work in progress.", ""])

          insert_at = len(lines)
          for i, line in enumerate(lines):
              if line.strip() == "## Unreleased":
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith("## "):
                      j += 1
                  insert_at = j
                  break

          section = [f"## v{version} - {today}", "", *notes, ""]
          lines = lines[:insert_at] + section + lines[insert_at:]
          changelog.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verify changelog entry
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq "^## v${{ steps.set_tag.outputs.version }} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for v${{ steps.set_tag.outputs.version }}."
            exit 1
          fi

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            Cargo.lock \
            CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "🔖 bump version to v${{ steps.set_tag.outputs.version }} and update changelog"
          fi
          if git rev-parse "v${{ steps.set_tag.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.set_tag.outputs.version }} already exists."
            exit 1
          fi
          git tag "v${{ steps.set_tag.outputs.version }}"
          git push origin main --tags

  build:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Cache title models
        uses: actions/cache@v4
        with:
          path: bronze-title-model/vendor/*.gguf
          key: gguf-${{ hashFiles('bronze-title-model/vendor/manifests/**') }}

      - name: Vendor title models when missing
        shell: bash
        run: |
          set -euo pipefail
          if ls bronze-title-model/vendor/*.gguf >/dev/null 2>&1; then
            echo "GGUF files already present"
          else
            sh bronze-title-model/scripts/vendor-gguf.sh all
          fi

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build arm64 app
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter desktop tauri build -- --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Package pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          app=""
          for candidate in \
            "apps/desktop/src-tauri/target/release/bundle/macos/Bronze.app" \
            "target/release/bundle/macos/Bronze.app"
          do
            if [[ -d "$candidate" ]]; then
              app="$candidate"
              break
            fi
          done
          if [[ -z "$app" ]]; then
            echo "Bronze.app was not produced."
            find . -name 'Bronze.app' -type d | head
            exit 1
          fi
          rm -rf pkgroot
          mkdir -p pkgroot/Applications
          cp -R "$app" pkgroot/Applications/
          pkgbuild --identifier app.bronze.desktop \
            --version "${{ needs.prepare.outputs.version }}" \
            --root pkgroot \
            dist/bronze-macos.pkg
          shasum -a 256 dist/bronze-macos.pkg | awk '{print $1 "  bronze-macos.pkg"}' \
            > dist/bronze-macos.pkg.sha256
          echo "This package is not a notarization claim." > dist/NOTARIZATION.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bronze-macos
          path: |
            dist/bronze-macos.pkg
            dist/bronze-macos.pkg.sha256
            dist/NOTARIZATION.txt

  release:
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify changelog is up to date
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq "^## v${{ needs.prepare.outputs.version }} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "Release blocked: CHANGELOG.md is not up to date for v${{ needs.prepare.outputs.version }}."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
