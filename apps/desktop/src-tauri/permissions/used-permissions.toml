[[permission]]
identifier = "allow-retest-used-permissions"
description = "Request Accessibility and Input Monitoring OS prompts (SET-003, SET-004)"
commands.allow = ["retest_used_permissions", "read_used_permissions"]

[[permission]]
identifier = "allow-open-privacy-settings"
description = "Open Privacy & Security panes for used permissions after a prompt attempt"
commands.allow = ["open_privacy_settings"]

[[permission]]
identifier = "allow-notification-authorization"
description = "Read and request Notification Center authorization when not denied"
commands.allow = [
  "notification_authorization_status",
  "request_notification_authorization",
]

[[permission]]
identifier = "allow-show-chrome-window"
description = "Show the Library, Settings, or Help window from the Quick Panel"
commands.allow = ["show_chrome_window"]

[[permission]]
identifier = "allow-queue-live"
description = "Composer, queue mutations, and copy for the Quick Panel"
commands.allow = [
  "list_queue_items",
  "list_overview_items",
  "queue_query",
  "queue_page_for_item",
  "add_composer_item",
  "apply_queue_item_action",
  "edit_queue_item",
  "copy_queue_items",
  "load_settings_v1",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-library-live"
description = "Library list, substring search, and Rust-owned backup/export/import"
commands.allow = [
  "list_queue_items",
  "search_library_items",
  "backup_library_now",
  "export_library_archive",
  "import_library_archive",
  "load_settings_v1",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-settings-live"
description = "Load, save, and reset SettingsV1 plus catalog locale"
commands.allow = [
  "load_settings_v1",
  "login_item_status",
  "save_settings_v1",
  "reset_settings_field",
  "reset_settings_group",
  "reset_settings_all",
  "search_settings_fields",
  "list_shortcuts",
  "record_shortcut",
  "restore_shortcut",
  "list_installed_apps",
  "pick_installed_app",
  "app_icon_data_url",
  "preview_settings_export",
  "export_settings_file",
  "import_settings_file",
  "list_title_models",
  "title_engine_status",
  "import_title_gguf",
  "list_ollama_title_models",
  "set_hosted_title_key",
  "clear_hosted_title_key",
  "hosted_title_disclosure",
  "app_version_info",
  "check_for_update",
  "open_release_page",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-ui-catalog"
description = "Read the effective UI locale and catalog strings"
commands.allow = ["ui_locale", "ui_catalog"]

[[permission]]
identifier = "allow-help-support"
description = "Preview and export a local redacted support file from Help"
commands.allow = ["preview_support_bundle", "export_support_file"]
