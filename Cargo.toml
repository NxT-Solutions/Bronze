[workspace]
resolver = "2"
members = [
    "bronze-domain",
    "bronze-capture",
    "bronze-storage",
    "bronze-settings",
    "bronze-diagnostics",
    "bronze-platform",
    "bronze-platform-macos",
    "bronze-title-model",
    "bronze-title-remote",
    "apps/desktop/src-tauri",
]

# llama.cpp debug builds miss the 8s title generate budget.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
