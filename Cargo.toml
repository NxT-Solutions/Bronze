[workspace]
resolver = "2"
members = [
    "crates/bronze-domain",
    "crates/bronze-capture",
    "crates/bronze-storage",
    "crates/bronze-settings",
    "crates/bronze-diagnostics",
    "crates/bronze-platform",
    "crates/bronze-platform-macos",
    "crates/bronze-title-model",
    "crates/bronze-title-remote",
    "apps/desktop/src-tauri",
]

# llama.cpp debug builds miss the 8s title generate budget.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
