<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze</title>
    <style>
      :root {
        --background: #f7f4ef;
        --foreground: #1c1917;
        --card: #ffffff;
        --card-foreground: #1c1917;
        --muted: #efe8de;
        --muted-foreground: #5c564e;
        --border: #756b60;
        --input: #756b60;
        --ring: #8c6239;
        --primary: #8c6239;
        --primary-foreground: #ffffff;
        --accent: #c4a265;
        --accent-foreground: #1c1917;
        --secondary: #efe8de;
        --secondary-foreground: #1c1917;
        --destructive: #b42318;
        --radius: 0.625rem;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "SF Pro Text", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        line-height: 1.45;
        margin: 0;
        min-height: 100vh;
        padding-inline: 1rem;
        padding-block: 0.75rem;
        background: #f7f4ef;
        color: #1c1917;
        overflow-x: hidden;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      #quick-panel,
      #copy-toolbar {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        overflow-x: hidden;
        max-width: 100%;
        gap: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 0;
      }
      h2 {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted-foreground);
        margin: 0 0 0.5rem;
      }
      nav[data-slot="chrome-nav"] {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .surface {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
      }
      label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        margin-block-end: 0.35rem;
      }
      textarea,
      input,
      select {
        width: 100%;
        min-height: 2.25rem;
        font: inherit;
        color: inherit;
        background: var(--background);
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 0.125rem);
        padding: 0.5rem 0.65rem;
      }
      textarea {
        min-height: 6rem;
        resize: vertical;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 2.25rem;
        min-width: 2.25rem;
        padding: 0.4rem 0.75rem;
        border-radius: calc(var(--radius) - 0.125rem);
        border: 1px solid var(--border);
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      button[type="submit"] {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: var(--primary);
      }
      menu {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0;
        margin: 0.5rem 0 0;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      article {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
      }
      article p {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.875rem;
      }
      output {
        display: block;
        margin-block-start: 0.5rem;
      }
      pre {
        margin: 0.35rem 0 0;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
      @media (prefers-contrast: more) {
        :root {
          --border: #000000;
          --input: #000000;
          --ring: #000000;
        }
        button,
        input,
        textarea,
        select {
          border-width: 2px !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="quick-panel" data-physical-edge="left" lang="en" dir="ltr">
      <h1 id="quick-title" data-i18n="panel.quick.title">Bronze</h1>
      <nav data-slot="chrome-nav" aria-labelledby="quick-title">
        <button type="button" data-open-window="library" data-i18n="library.title">
          Library
        </button>
        <button
          type="button"
          data-open-window="settings"
          data-i18n="settings.title"
        >
          Settings
        </button>
      </nav>
      <section id="active-section" class="surface" aria-labelledby="active-section-title">
        <h2 id="active-section-title" data-i18n="panel.section.active">Inbox</h2>
      </section>
      <form id="composer" class="surface" data-slot="composer">
        <label for="composer-body" data-i18n="composer.add.label">Add item</label>
        <textarea id="composer-body" name="body" rows="4"></textarea>
        <button type="submit" data-i18n="composer.add.submit">Add</button>
        <p id="composer-error" hidden role="alert" data-i18n="composer.add.error">
          Could not add item
        </p>
      </form>
      <div id="copy-toolbar" class="surface" data-slot="copy-toolbar">
        <label for="output-profile" data-i18n="copy.profile.label">
          Output profile
        </label>
        <select id="output-profile" name="profile">
          <option value="plain" selected>Plain</option>
        </select>
        <button type="button" data-i18n="copy.action.copy">Copy</button>
        <details data-slot="toolbar-overflow">
          <summary data-i18n="panel.toolbar.overflow">More actions</summary>
        </details>
        <output>
          <strong data-i18n="copy.preview.label">Preview</strong>
          <pre>park</pre>
        </output>
      </div>
      <ul id="queue">
        <li>
          <article lang="und" dir="auto">
            <p>park</p>
            <menu>
              <button type="button" data-i18n="queue.item.moveUp">Move up</button>
              <button type="button" data-i18n="queue.item.moveDown">
                Move down
              </button>
              <button type="button" data-i18n="queue.item.complete">
                Complete
              </button>
              <button type="button" data-i18n="queue.item.skip">Skip</button>
              <button type="button" data-i18n="queue.item.trash">Trash</button>
              <button type="button" data-i18n="queue.item.edit">Edit</button>
            </menu>
          </article>
        </li>
      </ul>
    </main>
    <script>
      function invokeChrome(kind) {
        const tauri = window.__TAURI__;
        if (tauri && tauri.core && typeof tauri.core.invoke === "function") {
          return tauri.core.invoke("show_chrome_window", { kind: kind });
        }
        const internals = window.__TAURI_INTERNALS__;
        if (internals && typeof internals.invoke === "function") {
          return internals.invoke("show_chrome_window", { kind: kind });
        }
        return Promise.reject(new Error("invoke unavailable"));
      }
      document.querySelectorAll("[data-open-window]").forEach(function (button) {
        button.addEventListener("click", function () {
          const kind = button.getAttribute("data-open-window");
          if (kind) {
            invokeChrome(kind);
          }
        });
      });
    </script>
  </body>
</html>
