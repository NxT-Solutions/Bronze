<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze</title>
    <style>
      body {
        font-family: system-ui;
        margin: 0;
        min-height: 100vh;
        padding-inline: 1rem;
        padding-block: 0.75rem;
        background: #111;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <main id="quick-panel" data-physical-edge="left" lang="en" dir="ltr">
      <h1 data-i18n="panel.quick.title">Bronze</h1>
      <section id="active-section" aria-labelledby="active-section-title">
        <h2 id="active-section-title" data-i18n="panel.section.active">Inbox</h2>
      </section>
      <form id="composer" data-slot="composer">
        <label for="composer-body" data-i18n="composer.add.label">Add item</label>
        <textarea id="composer-body" name="body" rows="4"></textarea>
        <button type="submit" data-i18n="composer.add.submit">Add</button>
        <p id="composer-error" hidden role="alert" data-i18n="composer.add.error">
          Could not add item
        </p>
      </form>
      <div id="copy-toolbar" data-slot="copy-toolbar">
        <label for="output-profile" data-i18n="copy.profile.label">
          Output profile
        </label>
        <select id="output-profile" name="profile">
          <option value="plain" selected>Plain</option>
        </select>
        <button type="button" data-i18n="copy.action.copy">Copy</button>
        <output>
          <strong data-i18n="copy.preview.label">Preview</strong>
          <pre>park</pre>
        </output>
      </div>
      <ul id="queue">
        <li>
          <article lang="und" dir="auto">
            <p>park</p>
            <menu>
              <button type="button" data-i18n="queue.item.moveUp">Move up</button>
              <button type="button" data-i18n="queue.item.moveDown">
                Move down
              </button>
              <button type="button" data-i18n="queue.item.complete">
                Complete
              </button>
              <button type="button" data-i18n="queue.item.skip">Skip</button>
              <button type="button" data-i18n="queue.item.trash">Trash</button>
              <button type="button" data-i18n="queue.item.edit">Edit</button>
            </menu>
          </article>
        </li>
      </ul>
    </main>
  </body>
</html>
