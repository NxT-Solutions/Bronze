<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze Library</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body class="page">
    <main id="library" class="page-shell" data-library-state="ready">
      <header class="chrome-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 data-i18n="library.title">Library</h1>
        </div>
      </header>
      <nav class="segment" aria-label="Library">
        <a href="#archive" data-i18n="library.nav.archive">Archive</a>
        <a href="#trash" data-i18n="library.nav.trash">Trash</a>
        <a href="#search" data-i18n="library.nav.search">Search</a>
      </nav>
      <search id="search" class="search-card card">
        <label for="library-search" data-i18n="library.search.label">Search</label>
        <input id="library-search" type="search" name="q" />
        <p
          id="search-count"
          class="tabular muted"
          role="status"
          data-search-count
          data-i18n="queue.count"
        >
          0 items
        </p>
      </search>
      <section class="empty-state" aria-labelledby="library-empty-title">
        <h2 id="library-empty-title" data-i18n="library.state.empty">No items</h2>
      </section>
      <ul id="library-queue"></ul>
      <template id="library-item-template">
        <li>
          <article lang="und" dir="auto">
            <h3 data-slot="title" hidden data-i18n="queue.item.title">Item</h3>
            <div data-slot="body"></div>
            <button type="button" class="btn-ghost" data-slot="expand" aria-expanded="false" hidden data-i18n="queue.item.showMore">
              Show more
            </button>
            <span hidden data-slot="show-less" data-i18n="queue.item.showLess">Show less</span>
            <p class="muted" data-slot="source" hidden>
              <img data-slot="source-icon" alt="" width="16" height="16" hidden />
              <span data-slot="source-label" data-i18n="capture.source">From {appName}</span>
            </p>
          </article>
        </li>
      </template>
      <div class="surface library-dock">
        <div class="toolbar toolbar-secondary">
          <button type="button" data-i18n="library.archive">Archive</button>
          <button type="button" data-i18n="library.paginate">Next page</button>
          <button type="button" data-i18n="library.backup.now">Back Up Now</button>
          <button type="button" data-i18n="library.export">Export</button>
          <button type="button" data-i18n="library.import">Import</button>
        </div>
        <p class="muted" data-restore-preview data-i18n="library.restore.preview">
          Restore preview
        </p>
        <p
          class="muted"
          role="status"
          data-export-secret-warning
          data-i18n="export.preview.secretBodies"
        >
          Item bodies in this export may contain secrets.
        </p>
      </div>
    </main>
    <script type="module" src="./apply-locale.mjs"></script>
    <script type="module" src="./library-live.mjs"></script>
  </body>
</html>
