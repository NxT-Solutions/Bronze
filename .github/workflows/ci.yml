name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-js:
    name: quality-js
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_DAEMON: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec turbo run typecheck --no-daemon
      - run: pnpm exec turbo run test --no-daemon
      - run: pnpm exec turbo run validate --no-daemon

  quality-docs:
    name: quality-docs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tooling/planning-checks.py

  quality-rust:
    name: quality-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ubuntu-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --locked --exclude bronze-desktop --exclude bronze-title-model --exclude bronze-title-remote --exclude bronze-platform-macos -- -D warnings
      - run: cargo test --workspace --locked --exclude bronze-desktop --exclude bronze-title-model --exclude bronze-title-remote --exclude bronze-platform-macos

  quality-macos:
    name: quality-macos
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --locked --exclude bronze-desktop -- -D warnings
      - run: cargo test --workspace --locked --exclude bronze-desktop

  ci:
    name: CI
    if: always()
    needs: [quality-js, quality-docs, quality-rust, quality-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every quality job
        run: |
          set -euo pipefail
          test "${{ needs.quality-js.result }}" = "success"
          test "${{ needs.quality-docs.result }}" = "success"
          test "${{ needs.quality-rust.result }}" = "success"
          test "${{ needs.quality-macos.result }}" = "success"
