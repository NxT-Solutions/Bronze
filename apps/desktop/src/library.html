<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze Library</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body class="page">
    <a class="skip-link" href="#library-search" data-i18n="chrome.skip.toContent">Skip to content</a>
    <main id="library" class="page-shell" data-library-state="ready">
      <header class="chrome-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 id="library-title" data-i18n="library.title">Library</h1>
        </div>
        <search class="chrome-search">
          <label class="visually-hidden" for="library-search" data-i18n="library.search.label">
            Search library
          </label>
          <span class="chrome-search-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
              <circle
                cx="6.6"
                cy="6.6"
                r="4.1"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="m9.8 9.8 3.6 3.6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <input
            id="library-search"
            type="search"
            name="q"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            placeholder="Search library"
            aria-placeholder="Search library"
            data-i18n-placeholder="library.search.label"
          />
          <button
            type="button"
            class="chrome-search-clear"
            hidden
            data-search-clear
            data-i18n-aria-label="settings.search.clear"
            aria-label="Clear search"
          >
            <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M2.1 1.4 1.4 2.1 5.3 6 1.4 9.9l.7.7L6 6.7l3.9 3.9.7-.7L6.7 6l3.9-3.9-.7-.7L6 5.3z"
              />
            </svg>
          </button>
        </search>
      </header>
      <div class="library-toolbar">
        <nav id="library-nav" class="segment" tabindex="-1" aria-labelledby="library-title">
          <a href="#archive" aria-current="page" data-i18n="library.nav.archive">Archive</a>
          <a href="#trash" data-i18n="library.nav.trash">Trash</a>
        </nav>
        <p
          id="search-count"
          class="tabular muted"
          role="status"
          data-search-count
          data-i18n="queue.count"
        >
          0 items
        </p>
      </div>
      <section class="empty-state library-empty" aria-labelledby="library-empty-title">
        <h2 id="library-empty-title" data-i18n="library.state.empty">
          Capture or type in the queue to fill the archive.
        </h2>
      </section>
      <p hidden data-empty-message data-i18n="library.state.empty">
        Capture or type in the queue to fill the archive.
      </p>
      <p hidden data-empty-message data-i18n="library.state.emptyTrash">
        Trash is empty.
      </p>
      <p hidden data-empty-message data-i18n="library.state.emptySearch">
        Try a different search.
      </p>
      <h2 class="visually-hidden" data-i18n="library.heading.items">Items</h2>
      <ul id="library-queue"></ul>
      <template id="library-item-template">
        <li class="queue-item">
          <article lang="und" dir="auto">
            <h3 data-slot="title" hidden data-i18n="queue.item.title">Item</h3>
            <div data-slot="body"></div>
            <button type="button" class="btn-ghost" data-slot="expand" aria-expanded="false" hidden data-i18n="queue.item.showMore">
              Show more
            </button>
            <span hidden data-slot="show-less" data-i18n="queue.item.showLess">Show less</span>
            <p class="muted" data-slot="source" hidden>
              <img data-slot="source-icon" alt="" width="16" height="16" hidden />
              <span data-slot="source-label" data-i18n="capture.source">From {appName}</span>
            </p>
          </article>
        </li>
      </template>
      <footer class="library-dock">
        <div class="toolbar toolbar-secondary">
          <button type="button" class="btn-ghost" data-i18n="library.archive">Archive</button>
          <button type="button" class="btn-ghost" data-i18n="library.paginate">Next page</button>
          <button type="button" class="btn-ghost" data-i18n="library.backup.now">Back Up Now</button>
          <button type="button" class="btn-ghost" data-i18n="library.export">Export…</button>
          <button type="button" class="btn-ghost" data-i18n="library.import">Import…</button>
        </div>
        <p class="muted" data-restore-preview data-i18n="library.restore.preview">
          Restore preview
        </p>
        <p
          class="muted"
          role="status"
          data-export-secret-warning
          data-i18n="export.preview.secretBodies"
        >
          Item bodies in this export may contain secrets.
        </p>
      </footer>
    </main>
    <script type="module" src="./apply-locale.mjs"></script>
    <script type="module" src="./library-live.mjs"></script>
  </body>
</html>
