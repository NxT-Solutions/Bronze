name: Publish Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0). Leave empty to use latest."
        required: false

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Guard missing packages repo token
        id: token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        run: |
          if [[ -z "${PACKAGES_TOKEN}" ]]; then
            echo "PACKAGES_REPO_TOKEN not set; skipping tap publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release tag
        if: steps.token.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            echo "RELEASE_TAG=${RELEASE_TAG_INPUT}" >> "$GITHUB_ENV"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_TAG}" ]]; then
            echo "RELEASE_TAG=${DISPATCH_TAG}" >> "$GITHUB_ENV"
          else
            tag=$(gh release view -R "${REPO}" --json tagName --jq .tagName)
            echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          fi

      - name: Checkout packages repo
        if: steps.token.outputs.skip != 'true'
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${PACKAGES_TOKEN}@github.com/NxT-Solutions/homebrew-nxt-solutions-packages.git"
          default_branch=$(git ls-remote --symref "$remote" HEAD | awk '/^ref:/ {print $2}' | sed 's@refs/heads/@@')
          if [[ -z "${default_branch}" ]]; then
            for candidate in main master; do
              if git ls-remote --heads "$remote" "${candidate}" | grep -q "${candidate}$"; then
                default_branch="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${default_branch}" ]]; then
            echo "Could not resolve tap default branch."
            exit 1
          fi
          git clone "$remote" --branch "${default_branch}" --depth 1 homebrew-nxt-solutions-packages

      - name: Download release assets
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "bronze-macos.pkg" -D /tmp/releases

      - name: Generate Homebrew cask
        if: steps.token.outputs.skip != 'true'
        working-directory: homebrew-nxt-solutions-packages
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["REPO"]
          pkg = Path("/tmp/releases/bronze-macos.pkg")
          if not pkg.is_file():
              raise SystemExit("Missing bronze-macos.pkg")
          sha = hashlib.sha256(pkg.read_bytes()).hexdigest()
          Path("Casks").mkdir(exist_ok=True)
          formula = Path("Formula/bronze.rb")
          if formula.exists():
              formula.unlink()
          Path("Casks/bronze.rb").write_text(
              "\n".join(
                  [
                      'cask "bronze" do',
                      f'  version "{version}"',
                      f'  sha256 "{sha}"',
                      "",
                      f'  url "https://github.com/{repo}/releases/download/{tag}/bronze-macos.pkg"',
                      '  name "Bronze"',
                      '  desc "Local-first macOS selection-to-action queue"',
                      f'  homepage "https://github.com/{repo}"',
                      "",
                      '  depends_on macos: ">= :sonoma"',
                      "  depends_on arch: :arm64",
                      "",
                      '  pkg "bronze-macos.pkg"',
                      "",
                      '  uninstall pkgutil: "app.bronze.desktop"',
                      "",
                      "  caveats <<~EOS",
                      "    Bronze ships an arm64 package. Intel/universal2 stays Proposed (ADR-002).",
                      "    This cask does not claim Apple notarization.",
                      "  EOS",
                      "end",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as fh:
              fh.write(f"VERSION={version}\n")
          PY

      - name: Commit and push
        if: steps.token.outputs.skip != 'true'
        working-directory: homebrew-nxt-solutions-packages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Casks/bronze.rb
          git reset HEAD -- Formula/bronze.rb 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "bronze ${VERSION}"
          git push -u origin HEAD
