<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <main id="quick-panel" data-physical-edge="left" lang="en" dir="ltr">
      <header class="chrome-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 id="quick-title" data-i18n="panel.quick.title">Bronze</h1>
        </div>
      </header>
      <form id="composer" class="composer-well card" data-slot="composer">
        <label class="visually-hidden" for="composer-body" data-i18n="composer.add.label">
          Add item
        </label>
        <textarea
          id="composer-body"
          name="body"
          rows="3"
          data-i18n-placeholder="composer.placeholder"
          placeholder="Type or Capture"
        ></textarea>
        <button type="submit" class="btn-primary" data-i18n="composer.add.submit">
          Add
        </button>
        <p id="composer-error" hidden role="alert" data-i18n="composer.add.error">
          Could not add item
        </p>
      </form>
      <p id="queue-empty" class="empty-state" data-i18n="panel.empty">
        Select text and Capture, or type here.
      </p>
      <ul id="queue"></ul>
      <template id="queue-item-template">
        <li>
          <article lang="und" dir="auto">
            <p data-slot="body"></p>
            <div class="row-actions">
              <button type="button" class="btn-primary" data-queue-action="copy" data-i18n="copy.action.copy">
                Copy
              </button>
              <details data-slot="toolbar-overflow">
                <summary data-i18n="panel.toolbar.overflow">More actions</summary>
                <menu>
                  <button type="button" class="btn-toolbar" data-queue-action="complete" data-i18n="queue.item.complete">
                    Complete
                  </button>
                  <button type="button" class="btn-toolbar" data-queue-action="skip" data-i18n="queue.item.skip">
                    Skip
                  </button>
                  <button type="button" class="btn-toolbar" data-queue-action="trash" data-i18n="queue.item.trash">
                    Trash
                  </button>
                  <button type="button" class="btn-toolbar" data-queue-action="edit" data-i18n="queue.item.edit">
                    Edit
                  </button>
                  <button type="button" class="btn-toolbar" data-queue-action="moveUp" data-i18n="queue.item.moveUp">
                    Move up
                  </button>
                  <button type="button" class="btn-toolbar" data-queue-action="moveDown" data-i18n="queue.item.moveDown">
                    Move down
                  </button>
                </menu>
              </details>
            </div>
          </article>
        </li>
      </template>
      <select id="output-profile" class="visually-hidden" name="profile" aria-hidden="true" tabindex="-1">
        <option value="plain" selected>Plain</option>
        <option value="markdown">Markdown</option>
      </select>
    </main>
    <script type="module" src="./apply-locale.mjs"></script>
    <script type="module" src="./queue-live.mjs"></script>
  </body>
</html>
