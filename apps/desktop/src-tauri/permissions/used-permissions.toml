[[permission]]
identifier = "allow-retest-used-permissions"
description = "Request Accessibility and Input Monitoring OS prompts (SET-003, SET-004)"
commands.allow = ["retest_used_permissions"]

[[permission]]
identifier = "allow-open-privacy-settings"
description = "Open Privacy & Security panes for used permissions after a prompt attempt"
commands.allow = ["open_privacy_settings"]

[[permission]]
identifier = "allow-show-chrome-window"
description = "Show the Library, Settings, or Help window from the Quick Panel"
commands.allow = ["show_chrome_window"]

[[permission]]
identifier = "allow-queue-live"
description = "Composer, queue mutations, and copy for the Quick Panel"
commands.allow = [
  "list_queue_items",
  "list_overview_items",
  "add_composer_item",
  "apply_queue_item_action",
  "edit_queue_item",
  "copy_queue_items",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-library-live"
description = "Library list, substring search, and Rust-owned backup/export/import"
commands.allow = [
  "list_queue_items",
  "search_library_items",
  "backup_library_now",
  "export_library_archive",
  "import_library_archive",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-settings-live"
description = "Load, save, and reset SettingsV1 plus catalog locale"
commands.allow = [
  "load_settings_v1",
  "save_settings_v1",
  "reset_settings_field",
  "reset_settings_group",
  "reset_settings_all",
  "search_settings_fields",
  "list_installed_apps",
  "pick_installed_app",
  "app_icon_data_url",
  "ui_locale",
  "ui_catalog",
]

[[permission]]
identifier = "allow-ui-catalog"
description = "Read the effective UI locale and catalog strings"
commands.allow = ["ui_locale", "ui_catalog"]
