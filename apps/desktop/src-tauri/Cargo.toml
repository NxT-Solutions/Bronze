[package]
name = "bronze-desktop"
version = "0.1.0"
description = "Bronze"
authors = ["Bronze contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
bronze-platform-macos = { path = "../../../bronze-platform-macos", default-features = false }
bronze-domain = { path = "../../../bronze-domain" }
bronze-storage = { path = "../../../bronze-storage" }
bronze-settings = { path = "../../../bronze-settings" }
bronze-capture = { path = "../../../bronze-capture" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSThread",
] }
