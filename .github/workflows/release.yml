name: 🔖 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.set_tag.outputs.release_tag }}
      version: ${{ steps.set_tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set version
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          version="${input#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          VERSION="${version}" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          cargo = Path("apps/desktop/src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
          cargo.write_text(text, encoding="utf-8")

          conf = Path("apps/desktop/src-tauri/tauri.conf.json")
          conf_text = conf.read_text(encoding="utf-8")
          conf_text, n = re.subn(
              r'"version": "[^"]+"',
              f'"version": "{version}"',
              conf_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("tauri.conf.json version was not updated")
          conf.write_text(conf_text, encoding="utf-8")

          desktop_pkg = Path("apps/desktop/package.json")
          pkg_text = desktop_pkg.read_text(encoding="utf-8")
          pkg_text, n = re.subn(
              r'"version": "[^"]+"',
              f'"version": "{version}"',
              pkg_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("apps/desktop/package.json version was not updated")
          desktop_pkg.write_text(pkg_text, encoding="utf-8")

          lock = Path("Cargo.lock")
          lines = lock.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          in_pkg = False
          for line in lines:
              if line.startswith("[[package]]"):
                  in_pkg = False
              if line.strip() == 'name = "bronze-desktop"':
                  in_pkg = True
              if in_pkg and line.strip().startswith("version = "):
                  line = f'version = "{version}"\n'
                  in_pkg = False
              out.append(line)
          lock.write_text("".join(out), encoding="utf-8")
          PY

      - name: Update changelog
        shell: bash
        env:
          VERSION: ${{ steps.set_tag.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION}" python3 - <<'PY'
          import datetime
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          today = datetime.date.today().isoformat()
          changelog = Path("CHANGELOG.md")
          if not changelog.exists():
              changelog.write_text(
                  "\n".join(
                      [
                          "# Changelog",
                          "",
                          "All notable changes to this project will be documented in this file.",
                          "This file is auto-updated by the release workflow.",
                          "",
                          "## Unreleased",
                          "",
                          "- Work in progress.",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )

          text = changelog.read_text(encoding="utf-8")
          if re.search(
              rf"^## v{re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$",
              text,
              re.M,
          ):
              print(f"CHANGELOG already has v{version}")
              raise SystemExit(0)

          lines = text.splitlines()
          all_tags = (
              subprocess.check_output(
                  ["git", "tag", "--list", "v*", "--sort=-v:refname"], text=True
              )
              .strip()
              .splitlines()
          )
          current_tag = f"v{version}"
          previous_tag = next((tag for tag in all_tags if tag != current_tag), None)
          range_spec = "HEAD" if previous_tag is None else f"{previous_tag}..HEAD"
          commits = (
              subprocess.check_output(
                  ["git", "log", "--no-merges", "--pretty=format:%s", range_spec],
                  text=True,
              )
              .strip()
              .splitlines()
          )
          messages = []
          for subject in commits:
              subject = subject.strip()
              if not subject:
                  continue
              if "bump version to v" in subject.lower():
                  continue
              messages.append(subject)
          if not messages:
              messages = ["Internal maintenance updates."]
          notes = [f"- {subject}" for subject in messages]

          version_header_pattern = re.compile(
              rf"^## v{re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$"
          )
          cleaned = []
          index = 0
          while index < len(lines):
              if version_header_pattern.match(lines[index].strip()):
                  index += 1
                  while index < len(lines) and not lines[index].startswith("## "):
                      index += 1
                  continue
              cleaned.append(lines[index])
              index += 1
          lines = cleaned

          if not any(line.strip() == "## Unreleased" for line in lines):
              if lines and lines[-1].strip():
                  lines.append("")
              lines.extend(["## Unreleased", "", "- Work in progress.", ""])

          insert_at = len(lines)
          for i, line in enumerate(lines):
              if line.strip() == "## Unreleased":
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith("## "):
                      j += 1
                  insert_at = j
                  break

          section = [f"## v{version} - {today}", "", *notes, ""]
          lines = lines[:insert_at] + section + lines[insert_at:]
          changelog.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verify changelog entry
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq "^## v${{ steps.set_tag.outputs.version }} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for v${{ steps.set_tag.outputs.version }}."
            exit 1
          fi

      - name: Tag only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          git add \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            Cargo.lock \
            CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Release does not push main. Land version and changelog on main first."
            git diff --cached
            exit 1
          fi
          tag="v${{ steps.set_tag.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Using existing tag $tag"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  build:
    needs: prepare
    # Named artifacts: bronze-macos-arm64.pkg and bronze-macos-x86_64.pkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            pkg_arch: arm64
            artifact: bronze-macos-arm64
            cmake_arch: arm64
            runs_on: macos-15
          - rust_target: x86_64-apple-darwin
            pkg_arch: x86_64
            artifact: bronze-macos-x86_64
            cmake_arch: x86_64
            runs_on: macos-15-intel
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reuse tag v0.1.0 for the GitHub Release. Build this dispatch
          # commit so Swift --arch and the split packages land.
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Cache title models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/bronze-title-model/vendor/*.gguf
          key: gguf-${{ hashFiles('crates/bronze-title-model/vendor/manifests/**') }}

      - name: Vendor title models when missing
        shell: bash
        run: |
          set -euo pipefail
          if ls crates/bronze-title-model/vendor/*.gguf >/dev/null 2>&1; then
            echo "GGUF files already present"
          else
            sh crates/bronze-title-model/scripts/vendor-gguf.sh all
          fi

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.pkg_arch }} app
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter desktop exec tauri build --target ${{ matrix.rust_target }} --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-","minimumSystemVersion":"14.0"}}}'

      - name: Package pkg
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          app=""
          for candidate in \
            "target/${RUST_TARGET}/release/bundle/macos/Bronze.app" \
            "apps/desktop/src-tauri/target/${RUST_TARGET}/release/bundle/macos/Bronze.app" \
            "target/release/bundle/macos/Bronze.app" \
            "apps/desktop/src-tauri/target/release/bundle/macos/Bronze.app"
          do
            if [[ -d "$candidate" ]]; then
              app="$candidate"
              break
            fi
          done
          if [[ -z "$app" ]]; then
            echo "Bronze.app was not produced."
            find . -name 'Bronze.app' -type d | head
            exit 1
          fi
          icon_name=$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")
          if [[ "$icon_name" != "icon.icns" ]]; then
            echo "CFBundleIconFile is ${icon_name}, expected icon.icns."
            exit 1
          fi
          iconset=$(mktemp -d)
          iconutil -c iconset "$app/Contents/Resources/icon.icns" -o "$iconset/App.iconset"
          width=$(sips -g pixelWidth "$iconset/App.iconset/icon_512x512@2x.png" | awk '/pixelWidth/{print $2}')
          rm -rf "$iconset"
          if [[ "$width" != "1024" ]]; then
            echo "Bundled icon.icns largest image is ${width}px, expected 1024."
            exit 1
          fi
          python3 tooling/dock-icon-fill.py "$app/Contents/Resources/icon.icns"
          rm -rf pkgroot
          mkdir -p pkgroot/Applications
          cp -R "$app" pkgroot/Applications/
          # pkg-info relocatable="false" still emits <relocate> for each bundle.
          # PackageKit then installs onto any existing app.bronze.desktop bundle
          # instead of /Applications/Bronze.app.
          pkgbuild --analyze --root pkgroot components.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :${i}:BundleIsRelocatable" components.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :${i}:BundleIsRelocatable false" components.plist
            i=$((i + 1))
          done
          if [[ "$i" -eq 0 ]]; then
            echo "pkgbuild --analyze found no components."
            exit 1
          fi
          found=0
          for ((j = 0; j < i; j++)); do
            path=$(/usr/libexec/PlistBuddy -c "Print :${j}:RootRelativeBundlePath" components.plist)
            if [[ "$path" == "Applications/Bronze.app" ]]; then
              found=1
            fi
          done
          if [[ "$found" -ne 1 ]]; then
            echo "Package root is missing Applications/Bronze.app."
            /usr/libexec/PlistBuddy -c 'Print' components.plist
            exit 1
          fi
          pkgbuild --identifier app.bronze.desktop \
            --version "${{ needs.prepare.outputs.version }}" \
            --root pkgroot \
            --component-plist components.plist \
            "dist/${ARTIFACT}.pkg"
          meta=$(mktemp -d)
          xar -xf "dist/${ARTIFACT}.pkg" -C "$meta" PackageInfo
          if awk '/<relocate>/,/<\/relocate>/' "$meta/PackageInfo" | grep -q '<bundle '; then
            echo "Bronze.app is still relocatable and will not stay in /Applications."
            cat "$meta/PackageInfo"
            exit 1
          fi
          rm -rf "$meta"
          shasum -a 256 "dist/${ARTIFACT}.pkg" | awk -v name="${ARTIFACT}.pkg" '{print $1 "  " name}' \
            > "dist/${ARTIFACT}.pkg.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.pkg
            dist/${{ matrix.artifact }}.pkg.sha256

  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Verify changelog is up to date
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq "^## v${{ needs.prepare.outputs.version }} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "Release blocked: CHANGELOG.md is not up to date for v${{ needs.prepare.outputs.version }}."
            exit 1
          fi

      # action-gh-release deletes by basename. Two NOTARIZATION.txt files in
      # the upload set 404 on the second delete and fail the job.
      - name: Stage unique release files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p staged
          cp -f dist/bronze-macos-arm64/bronze-macos-arm64.pkg staged/
          cp -f dist/bronze-macos-arm64/bronze-macos-arm64.pkg.sha256 staged/
          cp -f dist/bronze-macos-x86_64/bronze-macos-x86_64.pkg staged/
          cp -f dist/bronze-macos-x86_64/bronze-macos-x86_64.pkg.sha256 staged/
          echo "This package is not a notarization claim." > staged/NOTARIZATION.txt
          ls -la staged
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            for name in bronze-macos.pkg bronze-macos.pkg.sha256; do
              gh release delete-asset "$RELEASE_TAG" "$name" -R "$REPO" --yes || true
            done
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
